name: Nightly Build

on:
  schedule:
    # Runs at 12:00 AM India time (18:30 UTC previous day)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Only build if something changed since last nightly
  # ─────────────────────────────────────────────────────────────────────────────
  check_for_changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check_changes
        run: |
          git fetch --tags
          LATEST_NIGHTLY_TAG=$(git tag -l "nightly-*" | sort -r | head -n 1 || echo "")

          if [ -z "$LATEST_NIGHTLY_TAG" ]; then
            echo "No previous nightly build found. Proceeding with build."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list --count $LATEST_NIGHTLY_TAG..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since last nightly build. Skipping."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found $COMMIT_COUNT new commits since last nightly build."
          CHANGED_FILES=$(git diff --name-only $LATEST_NIGHTLY_TAG..HEAD)

          if echo "$CHANGED_FILES" | grep -q -E '^(src|android|index\.js|app\.config\.js)'; then
            echo "Changes detected. Proceeding with build."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant changes. Skipping build."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build the APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    needs: check_for_changes
    if: ${{ needs.check_for_changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      # ── Grab commit info ───────────────────────────────────────────────
      - name: Get commit info
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/[^a-zA-Z0-9 .,;:_()-]//g')" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=%an)" >> $GITHUB_ENV

      # ── Node 18 ───────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # ── Java 17 ───────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Gradle cache ──────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Install deps ──────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Expo Prebuild ─────────────────────────────────────────────────
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # ── Pre-bundle JS (avoids Metro crash inside Gradle) ──────────────
      - name: Create assets folder
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JavaScript for Release
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # ── Make gradlew executable ───────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── Build timestamps ──────────────────────────────────────────────
      - name: Set build timestamp
        run: |
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "RELEASE_TAG=nightly-$(date -u '+%Y%m%d')" >> $GITHUB_ENV

      # ── Build debug-signed APK (uses debug.keystore automatically) ────
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -x createBundleReleaseJsAndAssets \
            --no-daemon \
            --max-workers 2
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── Identify & rename APKs ────────────────────────────────────────
      - name: Identify APKs
        id: apk_files
        run: |
          VERSION=$(grep -m 1 "versionName " android/app/build.gradle | sed 's/.*versionName "\(.*\)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p apks
          APK_PATHS=""

          UNIVERSAL=$(find android/app/build/outputs/apk/release -name "*universal*.apk" -not -name "*unsigned*" | head -1)
          ARMV7=$(find android/app/build/outputs/apk/release -name "*armeabi-v7a*.apk" -not -name "*unsigned*" | head -1)
          ARMV8=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" -not -name "*unsigned*" | head -1)

          # Fallback: grab any APK if splits not found
          if [ -z "$UNIVERSAL" ] && [ -z "$ARMV7" ] && [ -z "$ARMV8" ]; then
            ANY=$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)
            if [ -f "$ANY" ]; then
              NAME="FilmFans-nightly-v${VERSION}-${BUILD_DATE}.apk"
              cp "$ANY" "apks/${NAME}"
              APK_PATHS="apks/${NAME}"
            fi
          fi

          if [ -f "$UNIVERSAL" ]; then
            NAME="FilmFans-nightly-v${VERSION}-universal-${BUILD_DATE}.apk"
            cp "$UNIVERSAL" "apks/${NAME}"
            echo "UNIVERSAL_APK_NAME=${NAME}" >> $GITHUB_ENV
            echo "UNIVERSAL_APK_FOUND=true" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${NAME},"
          else
            echo "UNIVERSAL_APK_FOUND=false" >> $GITHUB_ENV
          fi

          if [ -f "$ARMV7" ]; then
            NAME="FilmFans-nightly-v${VERSION}-armv7-${BUILD_DATE}.apk"
            cp "$ARMV7" "apks/${NAME}"
            echo "ARMV7_APK_NAME=${NAME}" >> $GITHUB_ENV
            echo "ARMV7_APK_FOUND=true" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${NAME},"
          else
            echo "ARMV7_APK_FOUND=false" >> $GITHUB_ENV
          fi

          if [ -f "$ARMV8" ]; then
            NAME="FilmFans-nightly-v${VERSION}-armv8-${BUILD_DATE}.apk"
            cp "$ARMV8" "apks/${NAME}"
            echo "ARMV8_APK_NAME=${NAME}" >> $GITHUB_ENV
            echo "ARMV8_APK_FOUND=true" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${NAME},"
          else
            echo "ARMV8_APK_FOUND=false" >> $GITHUB_ENV
          fi

          APK_PATHS=$(echo $APK_PATHS | sed 's/,$//')
          echo "apk_paths=${APK_PATHS}" >> $GITHUB_OUTPUT
          echo "APKs ready:" && ls -la apks/

      # ── Delete old nightly releases ───────────────────────────────────
      - name: Delete Previous Nightly Releases
        run: |
          git fetch --tags
          NIGHTLY_TAGS=$(git tag -l "nightly-*" || echo "")
          if [ -n "$NIGHTLY_TAGS" ]; then
            for TAG in $NIGHTLY_TAGS; do
              git tag -d $TAG 2>/dev/null || true
              git push --delete origin $TAG 2>/dev/null || true
              RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | \
                grep -o '"id": [0-9]*' | head -1 | sed 's/"id": //')
              if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
                curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
              fi
            done
          fi

      # ── Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'Nightly Build v${{ env.APP_VERSION }} (${{ env.BUILD_DATE }})'
          body: |
            > ⚠️ **NIGHTLY BUILD** ⚠️
            > Automated nightly build — may contain bugs. For stable builds use the latest non-prerelease tag.

            **Version:** v${{ env.APP_VERSION }}
            **Build Date:** ${{ env.BUILD_DATE }}
            **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ env.COMMIT_AUTHOR }}
            **Commit Message:** ${{ env.COMMIT_MSG }}
          files: ${{ steps.apk_files.outputs.apk_paths }}
          draft: false
          prerelease: true

      # ── Upload as artifact (backup) ───────────────────────────────────
      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FilmFans-Nightly-v${{ env.APP_VERSION }}-${{ env.BUILD_DATE }}
          path: apks/*.apk
          if-no-files-found: warn

      # ── Discord notification ───────────────────────────────────────────
      - name: Send Discord notification
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
          TIMESTAMP=$(date -u --iso-8601=seconds)
          FORMATTED_MSG=$(echo "$COMMIT_MSG" | sed 's/"/\\"/g')

          DOWNLOAD_SECTION=""
          [ "$UNIVERSAL_APK_FOUND" = "true" ] && \
            DOWNLOAD_SECTION="${DOWNLOAD_SECTION}• [📱 **Universal**](${REPO_URL}/releases/download/${RELEASE_TAG}/${UNIVERSAL_APK_NAME}) — All devices\n"
          [ "$ARMV7_APK_FOUND" = "true" ] && \
            DOWNLOAD_SECTION="${DOWNLOAD_SECTION}• [📱 **ARMv7**](${REPO_URL}/releases/download/${RELEASE_TAG}/${ARMV7_APK_NAME}) — Older devices\n"
          [ "$ARMV8_APK_FOUND" = "true" ] && \
            DOWNLOAD_SECTION="${DOWNLOAD_SECTION}• [📱 **ARMv8**](${REPO_URL}/releases/download/${RELEASE_TAG}/${ARMV8_APK_NAME}) — Newer devices ✅\n"
          DOWNLOAD_SECTION="${DOWNLOAD_SECTION}\n[All downloads](${RELEASE_URL})"

          curl -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🎬 FilmFans Nightly v${APP_VERSION}\",
              \"description\": \"New nightly build ready!\",
              \"color\": 3447003,
              \"fields\": [
                {\"name\": \"Version\", \"value\": \"v${APP_VERSION}\", \"inline\": true},
                {\"name\": \"Date\", \"value\": \"${BUILD_DATE}\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"${COMMIT_HASH} by ${COMMIT_AUTHOR}\", \"inline\": false},
                {\"name\": \"Message\", \"value\": \"${FORMATTED_MSG}\", \"inline\": false},
                {\"name\": \"Download\", \"value\": \"${DOWNLOAD_SECTION}\", \"inline\": false}
              ],
              \"footer\": {\"text\": \"⚠️ Nightly — may contain bugs\"},
              \"timestamp\": \"${TIMESTAMP}\"
            }]
          }" "${DISCORD_WEBHOOK}"
